---
name: Release projectpotos.roles

# The version bump and changelog land on main through a release PR
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
    uses: projectpotos/actions/.github/workflows/release-ansible-collection.yaml@6155527f763b74eb868aab52fc2c253aa0a1f6f0 # v0.6.2
    secrets:
      ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
