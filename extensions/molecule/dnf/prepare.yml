---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Plant unmanaged repositories
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/brotherhood.repo
        content: |
          [magneto]
          name=Magneto
          baseurl=https://magneto.example/repo/
          enabled=1

          [mystique]
          name=Mystique
          baseurl=https://mystique.example/repo/
          enabled=0
        mode: "0644"
