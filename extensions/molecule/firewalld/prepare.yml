---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Package - Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Service - Start and enable firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
